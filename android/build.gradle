plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.liquidglasstabsandroid'
version = '1.0.0'

android {
  namespace "expo.modules.liquidglasstabsandroid"
  defaultConfig {
    versionCode 2
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // No Jetpack Compose: the bar is a plain Android View (RenderNode + AGSL).
  // These two ship with every React Native app already; listed so the module compiles on its own.
  implementation 'androidx.core:core:1.13.1'                 // PathParser (icons), accessibility compat
  implementation 'androidx.customview:customview:1.1.0'      // ExploreByTouchHelper (TalkBack tabs)
}
